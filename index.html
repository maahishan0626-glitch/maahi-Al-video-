
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAAHI AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101018;color:white;
 font-family:Arial,sans-serif;padding:22px;
}
header{font-size:27px;font-weight:bold;color:#a78bfa}
p{color:#aaa;line-height:1.5}
h2{margin-top:35px}
.panel{
 background:#20202c;padding:18px;
 border-radius:16px;margin-top:18px;
}
textarea{
 width:100%;height:110px;padding:14px;
 border-radius:10px;border:1px solid #555;
 background:#15151e;color:white;font-size:16px;
}
button{
 width:100%;padding:16px;border:0;
 border-radius:12px;background:#8b5cf6;
 color:white;font-size:17px;font-weight:bold;
 margin-top:15px;
}
input,select{
 width:100%;padding:13px;margin-top:10px;
 background:#15151e;color:white;border:1px solid #555;
 border-radius:9px;
}
.preview{
 width:100%;min-height:170px;object-fit:contain;
 margin-top:15px;border-radius:12px;
}
</style>
</head>
<body>
<header>✦ MAAHI AI</header>
<p>Imagine it. Create it. Bring it to life.</p>

<div class="panel">
<h2>Text to Video</h2>
<p>Describe the video you want to create</p>
<textarea id="prompt" placeholder="A beautiful cinematic sunset over the ocean..."></textarea>
<h3>Video Quality</h3>
<select id="quality">
<option>720p</option>
<option>1080p</option>
</select>
<h3>Duration</h3>
<select id="duration">
<option>5 Seconds</option>
<option>10 Seconds</option>
</select>
<button onclick="generate()">✦ Generate Video</button>
</div>

<div class="panel">
<h2>Image to Video</h2>
<p>Upload a photo to animate it</p>
<input type="file" accept="image/*" onchange="previewImage(event)">
<img id="preview" class="preview" hidden>
<textarea placeholder="Describe how your photo should move..."></textarea>
<button onclick="alert('AI video generation API will be connected in the next development step.')">Animate Image</button>
</div>

<script>
function generate(){
 let prompt=document.getElementById('prompt').value;
 if(!prompt.trim()){
 alert('Please enter your video description');
 return;
 }
 alert('Your prompt is ready! AI video generation service needs to be connected next.');
}
function previewImage(event){
 const file=event.target.files[0];
 if(file){
 const img=document.getElementById('preview');
 img.src=URL.createObjectURL(file);
 img.hidden=false;
 }
}
</script>
</body>
</html>
